name: Backend checks
on:
  push:
    paths: ['backend/**', 'dotnet-tools.json', '.github/workflows/backend.yml']
  pull_request:
    paths: ['backend/**', 'dotnet-tools.json', '.github/workflows/backend.yml']
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          # 仅用于临时 CI 服务的公开测试密码，不能用于真实部署。
          MYSQL_ROOT_PASSWORD: pawhome_ci_only
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore backend/PawHome.slnx --locked-mode
      - run: dotnet build backend/PawHome.slnx --no-restore --configuration Release
      # 首先验证轻量关系数据库，再验证 MySQL 提供程序和真实迁移。
      - run: dotnet test backend/PawHome.slnx --no-build --configuration Release
      - run: dotnet test backend/PawHome.slnx --no-build --configuration Release
        env:
          PAWHOME_TEST_MYSQL: 'Server=127.0.0.1;Port=3306;User ID=root;Password=pawhome_ci_only;SslMode=Required'
